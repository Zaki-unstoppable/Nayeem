<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nayeem Nametag Bounce</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div id="box" class="void-box" aria-label="void box">
      <div id="tag" class="nametag">korea</div>

      <div id="corner-celebration" class="corner-celebration" aria-live="polite" hidden>
        <img id="celebration-gif" alt="Corner hit celebration gif" />
      </div>
    </div>
    <p class="hint">On exact corner hits, there is a 1 in 50 chance to show the GIF fullscreen.</p>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
